version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: africa
      POSTGRES_PASSWORD: africa
      POSTGRES_DB: africa
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3001:3000"
    restart: on-failure

volumes:
  postgres_data:
